name: Deploy mode-admin production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mode-admin-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production admin
        run: npm run build

      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy to production S3
        run: aws s3 sync ./dist/ s3://zeroadmin.kr --delete --no-progress

      - name: Invalidate production CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2F4R34LX88V05 \
            --paths "/*"

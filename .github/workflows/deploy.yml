name: Deploy mode-admin development

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mode-admin-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with development API
        run: npm run build:dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::103930328445:role/mode-admin-deploy-role
          aws-region: ap-northeast-2
          allowed-account-ids: "103930328445"

      - name: Deploy to company S3
        run: aws s3 sync ./dist/ s3://narrowwayco-model-web-admin --no-progress

      - name: Invalidate company CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E38GRU2BINWKWA \
            --paths "/*"

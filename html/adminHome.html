<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <link href="/src/css/reset.css" rel="stylesheet"/>
    <link href="/src/css/common.css" rel="stylesheet"/>
    <link href="/src/css/style.css" rel="stylesheet"/>
    <script src="/src/main.ts" type="module"></script>
    <!-- ✅ 메인 진입 -->

    <style>
        /* 검색바 */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-bar input,
        .filter-bar select {
            height: 40px;
            padding: 0 12px;
            border-radius: 6px;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
        }

        .filter-bar button {
            min-width: 100px;
        }

        /* 매장 테이블 스타일 */
        .store-table td, .store-table th {
            padding: 14px;
            white-space: nowrap;
        }

        /* 페이징 영역 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 12px;
        }

        /* 페이지네이션 버튼 개별 스타일링 */
        .pagination button {
            background: transparent; /* 🔥 기본 투명 */
            border: 1px solid #777; /* 🔥 옅은 회색 테두리 */
            color: #ddd; /* 🔥 회색 텍스트 */
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: auto; /* 🔥 공용 .btn 스타일 무시 */
        }

        /* 호버 시 반전 효과 */
        .pagination button:hover {
            background: #2080ff; /* 🔵 파란 배경 */
            border-color: #2080ff;
            color: white;
        }

        /* 오른쪽 버튼 영역 — 길이 고정 */
        .franchise-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0; /* 🔥 버튼 줄어들지 않음 */
            white-space: nowrap;
        }

        /* 관리 버튼 영역 */
        .franchise-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            width: 100px; /* 🔥 버튼 영역 고정 세로 폭 */
        }

        /* 테이블 안에서만 .btn width 초기화 */
        .tableArea .btn {
            width: auto !important; /* 🔥 강제 width 해제 */
            padding: 6px 10px;
            font-size: 0.9rem;
            border-radius: 6px;
        }

        /* 버튼 스타일 */
        .btn-edit,
        .btn-delete {
            padding: 4px 8px; /* 🔥 더 작게 */
            font-size: 0.75rem; /* 🔥 텍스트 크기 축소 */
            border-radius: 4px;
            white-space: nowrap;
            min-width: 45px; /* 🔥 버튼 최소 크기 보장 */
        }

        /* 파란 수정 버튼 */
        .btn-edit {
            background-color: #2080ff;
            color: white;
        }

        .btn-edit:hover {
            background-color: #1a6ed8;
        }

        /* 회색 삭제 버튼 */
        .btn-delete {
            background-color: #555;
            color: white;
        }

        .btn-delete:hover {
            background-color: #444;
        }


        #machine-token-dialog {
            position: fixed;
            inset: 0;
            margin: auto;
            width: min(420px, calc(100% - 32px));
            box-sizing: border-box;
            padding: 24px;
            border: 1px solid #454b55;
            border-radius: 16px;
            background: #20242c;
            color: #fff;
        }
        #machine-token-dialog::backdrop { background: rgb(0 0 0 / 70%); }
        #machine-token-dialog form { display: grid; gap: 14px; }
        #machine-token-dialog h2 { font-size: 1.15rem; overflow-wrap: anywhere; }
        #machine-token-dialog input { width: 100%; box-sizing: border-box; min-height: 44px; padding: 8px 12px; font-size: 16px; }
        #machine-token-error { color: #ffb4b4; overflow-wrap: anywhere; }
        .machine-token-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .machine-token-actions button { min-height: 44px; padding: 0 16px; border-radius: 8px; }
    </style>
</head>

<body>
<!-- 메인 -->
<div id="main-content">
    <!-- 커피봇 -->
    <section class="mt8">
        <div class="inner">
            <div class="user-flex">
                <div class="user">
                    <i class="fa-regular fa-circle-user"></i>
                    <p id="user-name">-</p>
                    <label class="label manager" id="user-grade"
                    ><span>-</span></label
                    >
                </div>
            </div>
        </div>
    </section>

    <section class="pb20">
        <div class="inner">

            <!-- 페이지 제목 -->
            <div class="title-flex mb20">
                <h2>매장 관리</h2>
            </div>

            <!-- 🔍 검색/필터 영역 -->
            <div class="filter-bar">
                <input id="searchKeyword" placeholder="계정 검색" type="text">

                <button class="btn-outline" id="filterBtn">검색</button>
            </div>

            <!-- 🏪 매장 리스트 테이블 -->
            <div class="tableArea St02">
                <table class="store-table">
                    <thead>
                    <tr>
                        <th>계정</th>
                        <th>오픈일</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody id="store-table-body"></tbody>
                </table>
            </div>

            <!-- 🔄 페이징 -->
            <div class="pagination">
                <button class="btn-outline" data-page="prev">◀ 이전</button>
                <span id="page-info">1 / 1</span>
                <button class="btn-outline" data-page="next">다음 ▶</button>
            </div>

        </div>
    </section>
</div>
        <dialog id="machine-token-dialog" aria-labelledby="machine-token-title">
            <form method="dialog">
                <h2 id="machine-token-title"><span id="machine-token-target"></span> 머신 토큰 등록</h2>
                <label for="machine-token-password">매장 비밀번호</label>
                <input type="password" id="machine-token-password" autocomplete="off" required maxlength="256" autofocus>
                <p id="machine-token-error" role="alert" hidden></p>
                <div class="machine-token-actions">
                    <button type="button" id="machine-token-cancel">취소</button>
                    <button type="submit" class="btn blue" id="machine-token-submit">등록</button>
                </div>
            </form>
        </dialog>
    </body>

<script>

</script>
</html>
